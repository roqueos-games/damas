<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Damas · desenvolvimento</title>
    <style>
      html,
      body,
      #jogo {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #080b16;
      }
      /* O corpo que o RoqueOS (com o Quasar) dá à página. Dentro dele o jogo herda isto;
         sozinho, sem isto, o HUD cai na serifada do navegador e o texto sobe uns 20 px. */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      /* O normalize do Quasar, que o RoqueOS carrega na página inteira: tudo em border-box
         e botão e campo herdando a fonte. Sem isto, sozinho, os botões das Damas caem na
         fonte do navegador (Arial 13,3 px no Chromium, system-ui 11 px no WebKit, medido em
         25/09/2026), e o campo do código, o QR e os cartões dos jogadores ficam mais
         largos pelo preenchimento e pela borda (o campo, 26 px). */
      html {
        box-sizing: border-box;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      button,
      input {
        font: inherit;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="jogo"></div>
    <script type="module" src="/dev/main.js"></script>
  </body>
</html>
